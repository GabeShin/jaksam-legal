<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>작샘 앱에서 비밀번호 재설정</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #FDF8F0;
      color: #2C2418;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
    }
    main {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 24px;
      line-height: 1.3;
    }
    p {
      margin: 0 0 24px;
      color: #6B5D4F;
      font-size: 15px;
      line-height: 1.5;
    }
    a.button {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 14px 18px;
      border-radius: 12px;
      background: #C4873B;
      color: #FFFFFF;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
    }
    .fallback {
      margin-top: 20px;
      font-size: 13px;
      line-height: 1.45;
      color: #9C8E7E;
    }
  </style>
</head>
<body>
  <main>
    <h1 id="title">작샘 앱에서 비밀번호 재설정</h1>
    <p id="body">잠시 후 작샘 앱이 열립니다. 자동으로 열리지 않으면 아래 버튼을 눌러주세요.</p>
    <a id="open-app" class="button" href="#" rel="noreferrer">앱에서 열기</a>
    <p class="fallback" id="fallback">앱이 열리지 않으면 작샘 앱에서 비밀번호 재설정을 다시 요청한 뒤, 같은 휴대폰에서 최신 이메일 링크를 열어주세요.</p>
  </main>
  <script>
    (function () {
      var APP_RESET_URL = "jaksam://auth/reset-password";
      var search = window.location.search || "";
      var hash = window.location.hash || "";

      var params = new URLSearchParams(search);
      var lang = (params.get("lang") || navigator.language || "ko").toLowerCase();
      var isKo = lang.indexOf("ko") === 0;

      var copy = isKo
        ? {
            title: "작샘 앱에서 비밀번호 재설정",
            body: "잠시 후 작샘 앱이 열립니다. 자동으로 열리지 않으면 아래 버튼을 눌러주세요.",
            button: "앱에서 열기",
            fallback: "앱이 열리지 않으면 작샘 앱에서 비밀번호 재설정을 다시 요청한 뒤, 같은 휴대폰에서 최신 이메일 링크를 열어주세요."
          }
        : {
            title: "Reset your password in Jaksam",
            body: "The Jaksam app should open shortly. If it does not, tap the button below.",
            button: "Open app",
            fallback: "If the app does not open, request a new password reset in the Jaksam app and open the newest email on this same phone."
          };

      document.documentElement.lang = isKo ? "ko" : "en";
      document.title = copy.title;
      document.getElementById("title").textContent = copy.title;
      document.getElementById("body").textContent = copy.body;
      document.getElementById("fallback").textContent = copy.fallback;

      var button = document.getElementById("open-app");
      button.textContent = copy.button;

      // Forward the full payload (PKCE ?code= in the query, or #access_token=… in the hash)
      // to the app's custom scheme. The app reads both via getAuthUrlParam().
      var appUrl = APP_RESET_URL + search + hash;
      button.setAttribute("href", appUrl);

      // Attempt to open the app automatically once. Some in-app browsers block
      // auto-navigation to custom schemes; the manual button (user gesture) is
      // the reliable fallback, and this page never leaves the user on a blank screen.
      window.setTimeout(function () {
        window.location.href = appUrl;
      }, 250);
    })();
  </script>
</body>
</html>
